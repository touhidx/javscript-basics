<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>what javascript can do?</h2>
    <p id="main">look closely</p>
    <button
      type="button"
      onclick="
        document.getElementById('main').innerHTML = 'Look it has changed!'
      "
    >
      click me
    </button>

    <script>
      document.write(6 + 5);
      window.alert("hey");
      alert("hey too");
    </script>
  </body>
</html>
